<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarkItDown 文档转换工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    color: #333;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
  }
  .container {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 720px;
    padding: 32px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 24px;
    color: #1a1a2e;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h1 .icon { font-size: 28px; }
  .section {
    margin-bottom: 20px;
  }
  .section-label {
    font-size: 14px;
    font-weight: 600;
    color: #555;
    margin-bottom: 8px;
  }
  .dir-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .dir-input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    font-size: 14px;
    color: #333;
    background: #fafafa;
    outline: none;
    transition: border-color 0.2s;
  }
  .dir-input:focus { border-color: #4f46e5; }
  .dir-input::placeholder { color: #bbb; }
  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn-select {
    background: #f0f0f0;
    color: #333;
    border: 1px solid #d9d9d9;
  }
  .btn-select:hover { background: #e0e0e0; }
  .btn-convert {
    background: #4f46e5;
    color: #fff;
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border-radius: 10px;
    margin-top: 8px;
  }
  .btn-convert:hover { background: #4338ca; }
  .btn-convert:disabled {
    background: #a5a3d9;
    cursor: not-allowed;
  }
  .info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: #f8f9ff;
    border-radius: 8px;
    font-size: 13px;
    color: #666;
    margin-bottom: 12px;
  }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: #e5e7eb;
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #4f46e5, #7c3aed);
    border-radius: 3px;
    transition: width 0.3s ease;
    width: 0%;
  }
  .log-area {
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 12px;
    height: 260px;
    overflow-y: auto;
    font-family: "Cascadia Code", "Consolas", monospace;
    font-size: 12px;
    line-height: 1.6;
    background: #fafafa;
    color: #444;
  }
  .log-area::-webkit-scrollbar { width: 6px; }
  .log-area::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  .log-success { color: #16a34a; }
  .log-fail { color: #dc2626; }
  .log-info { color: #6366f1; }
  .log-done { color: #4f46e5; font-weight: 600; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    margin-left: 8px;
  }
  .badge-ocr {
    background: #ede9fe;
    color: #6d28d9;
  }
  .divider {
    border: none;
    border-top: 1px solid #f0f0f0;
    margin: 20px 0;
  }
  .footer {
    text-align: center;
    font-size: 12px;
    color: #aaa;
    margin-top: 16px;
  }
</style>
</head>
<body>
<div class="container">
  <h1><span class="icon">📄</span> MarkItDown 文档转换工具</h1>

  <div class="section">
    <div class="section-label">📂 源目录（包含待转换文档的目录）</div>
    <div class="dir-row">
      <input type="text" id="sourceDir" class="dir-input" placeholder="请选择要转换的文档目录..." readonly>
      <button class="btn btn-select" onclick="selectSourceDir()">选择目录</button>
    </div>
  </div>

  <div class="section">
    <div class="section-label">📁 目标目录（Markdown 输出目录，保持源目录结构）</div>
    <div class="dir-row">
      <input type="text" id="targetDir" class="dir-input" placeholder="请选择 Markdown 输出目录..." readonly>
      <button class="btn btn-select" onclick="selectTargetDir()">选择目录</button>
    </div>
  </div>

  <hr class="divider">

  <div class="info-bar">
    <span>图片 OCR: <span class="badge badge-ocr">DeepSeek-OCR 已内置</span></span>
    <span id="statusText">就绪</span>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="log-area" id="logArea">
    <div class="log-info">欢迎使用 MarkItDown 文档转换工具，请选择源目录和目标目录后开始转换。</div>
  </div>

  <button class="btn btn-convert" id="convertBtn" onclick="startConvert()">🚀 开始转换</button>

  <div class="footer">MarkItDown · 图片自动提取 + DeepSeek-OCR 文字识别</div>
</div>

<script>
  let pollTimer = null;

  async function selectSourceDir() {
    const dir = await selectDir();
    if (dir) {
      document.getElementById('sourceDir').value = dir;
      // 自动填充目标目录
      if (!document.getElementById('targetDir').value) {
        document.getElementById('targetDir').value = dir + '_md';
      }
    }
  }

  async function selectTargetDir() {
    const dir = await selectDir();
    if (dir) {
      document.getElementById('targetDir').value = dir;
    }
  }

  async function selectDir() {
    try {
      const resp = await fetch('/api/select-dir');
      const data = await resp.json();
      return data.path || '';
    } catch (e) {
      console.error('选择目录失败:', e);
      return '';
    }
  }

  async function startConvert() {
    const sourceDir = document.getElementById('sourceDir').value;
    const targetDir = document.getElementById('targetDir').value;

    if (!sourceDir) { alert('请选择源目录'); return; }
    if (!targetDir) { alert('请选择目标目录'); return; }

    const btn = document.getElementById('convertBtn');
    btn.disabled = true;
    btn.textContent = '⏳ 转换中...';
    document.getElementById('logArea').innerHTML = '';
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('statusText').textContent = '转换中...';

    try {
      const resp = await fetch('/api/convert', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ source_dir: sourceDir, target_dir: targetDir })
      });
      const data = await resp.json();
      if (data.error) {
        addLog(data.error, 'fail');
        btn.disabled = false;
        btn.textContent = '🚀 开始转换';
        return;
      }
      // 开始轮询状态
      pollTimer = setInterval(pollStatus, 800);
    } catch (e) {
      addLog('请求失败: ' + e.message, 'fail');
      btn.disabled = false;
      btn.textContent = '🚀 开始转换';
    }
  }

  async function pollStatus() {
    try {
      const resp = await fetch('/api/status');
      const data = await resp.json();

      // 更新进度
      if (data.total > 0) {
        const pct = Math.round((data.current / data.total) * 100);
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('statusText').textContent =
          `转换中... ${data.current}/${data.total}`;
      }

      // 更新日志
      if (data.logs && data.logs.length > 0) {
        const logArea = document.getElementById('logArea');
        const currentCount = logArea.children.length;
        const newLogs = data.logs.slice(currentCount);
        newLogs.forEach(line => {
          if (line.startsWith('SUCCESS:')) {
            addLog('✅ ' + line.replace('SUCCESS:', ''), 'success');
          } else if (line.startsWith('FAIL:')) {
            addLog('❌ ' + line.replace('FAIL:', ''), 'fail');
          } else if (line.startsWith('DONE:')) {
            addLog('🏁 ' + line.replace('DONE:', ''), 'done');
          } else if (line.startsWith('PROGRESS:')) {
            // 进度已在上方处理
          } else {
            addLog(line, 'info');
          }
        });
        logArea.scrollTop = logArea.scrollHeight;
      }

      // 检查是否完成
      if (!data.converting) {
        clearInterval(pollTimer);
        pollTimer = null;
        const btn = document.getElementById('convertBtn');
        btn.disabled = false;
        btn.textContent = '🚀 开始转换';

        if (data.total > 0) {
          document.getElementById('progressFill').style.width = '100%';
          document.getElementById('statusText').textContent = '转换完成';
        }
      }
    } catch (e) {
      console.error('轮询失败:', e);
    }
  }

  function addLog(text, type) {
    const logArea = document.getElementById('logArea');
    const div = document.createElement('div');
    div.className = 'log-' + (type || 'info');
    div.textContent = text;
    logArea.appendChild(div);
    logArea.scrollTop = logArea.scrollHeight;
  }
</script>
</body>
</html>
