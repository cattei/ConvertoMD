<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD转换神器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #333;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    width: 100%;
    max-width: 700px;
    padding: 36px;
    position: relative;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 28px;
    color: #1a1a2e;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  h1 img {
    width: 36px;
    height: 36px;
    border-radius: 8px;
  }
  .bottom-right {
    position: absolute;
    bottom: 12px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .donate-btn {
    background: linear-gradient(135deg, #ff6b6b, #ee5a24);
    color: #fff;
    padding: 8px 16px;
    border: none;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .donate-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(238, 90, 36, 0.4);
  }
  .donate-tooltip {
    position: absolute;
    bottom: 60px;
    right: 0;
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    display: none;
    z-index: 100;
    min-width: 320px;
  }
  .donate-tooltip.show {
    display: block;
  }
  .donate-tooltip-title {
    font-size: 14px;
    font-weight: 600;
    color: #333;
    margin-bottom: 12px;
    text-align: center;
  }
  .donate-qrcodes {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  .donate-qrcode {
    text-align: center;
  }
  .donate-qrcode img {
    width: 140px;
    height: 140px;
    border: 2px solid #f0f0f0;
    border-radius: 8px;
  }
  .donate-qrcode-label {
    font-size: 12px;
    color: #666;
    margin-top: 6px;
  }
  .github-link {
    color: #667eea;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: color 0.2s;
  }
  .github-link:hover {
    color: #764ba2;
    text-decoration: underline;
  }
  .section { margin-bottom: 20px; }
  .section-label {
    font-size: 14px;
    font-weight: 600;
    color: #555;
    margin-bottom: 8px;
  }
  .dir-row { display: flex; gap: 8px; align-items: center; }
  .dir-input {
    flex: 1;
    padding: 10px 14px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 14px;
    color: #333;
    background: #f9fafb;
    outline: none;
    transition: border-color 0.2s;
  }
  .dir-input:focus { border-color: #667eea; }
  .dir-input::placeholder { color: #bbb; }
  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn-select {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
  }
  .btn-select:hover { opacity: 0.9; }
  .btn-convert {
    background: linear-gradient(135deg, #11998e, #38ef7d);
    color: #fff;
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border-radius: 12px;
    margin-top: 8px;
  }
  .btn-convert:hover { opacity: 0.9; }
  .btn-convert:disabled { background: #ccc; cursor: not-allowed; }
  
  .stats-panel {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: linear-gradient(135deg, #f8fafc, #f1f5f9);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }
  .stat-value {
    font-size: 24px;
    font-weight: 700;
    color: #667eea;
    margin-bottom: 4px;
  }
  .stat-label {
    font-size: 12px;
    color: #64748b;
  }
  
  .progress-section {
    background: #f0f0ff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .progress-title {
    font-size: 14px;
    font-weight: 600;
    color: #4f46e5;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .progress-status {
    font-size: 13px;
    color: #64748b;
  }
  .progress-bar {
    width: 100%;
    height: 12px;
    background: #e0e7ff;
    border-radius: 6px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #667eea, #764ba2);
    border-radius: 6px;
    transition: width 0.3s ease;
    width: 0%;
    position: relative;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 20px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
  }
  
  .log-area {
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    padding: 12px;
    height: 200px;
    overflow-y: auto;
    font-family: "Cascadia Code", "Consolas", monospace;
    font-size: 12px;
    line-height: 1.7;
    background: #f9fafb;
    color: #444;
    margin-bottom: 12px;
  }
  .log-area::-webkit-scrollbar { width: 6px; }
  .log-area::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  .log-success { color: #16a34a; }
  .log-fail { color: #dc2626; }
  .log-info { color: #6366f1; }
  .log-done { color: #4f46e5; font-weight: 700; }
  .log-skip { color: #f59e0b; }
  
  .failures-section {
    border: 2px solid #fee2e2;
    border-radius: 10px;
    padding: 12px;
    background: #fef2f2;
    display: none;
    max-height: 200px;
    overflow-y: auto;
  }
  .failures-section.show { display: block; }
  .failures-header {
    font-size: 13px;
    font-weight: 600;
    color: #dc2626;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .failure-item {
    font-size: 12px;
    padding: 6px 0;
    border-bottom: 1px solid #fecaca;
    color: #991b1b;
  }
  .failure-item:last-child { border-bottom: none; }
  .failure-path { font-family: monospace; }
  .failure-reason { color: #b91c1c; font-size: 11px; }
  
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-ocr { background: #ede9fe; color: #6d28d9; }
  .divider { border: none; border-top: 1px solid #f0f0f0; margin: 20px 0; }
  .footer { text-align: center; font-size: 12px; color: #aaa; margin-top: 16px; }
</style>
</head>
<body>
<div class="container">
  <h1><img src="img/logo.jpg" alt="logo"> MD转换神器</h1>

  <div class="section">
    <div class="section-label">📂 源目录（包含待转换文档的目录）</div>
    <div class="dir-row">
      <input type="text" id="sourceDir" class="dir-input" placeholder="请选择要转换的文档目录..." readonly>
      <button class="btn btn-select" onclick="selectSourceDir()">选择目录</button>
    </div>
  </div>

  <div class="section">
    <div class="section-label">📁 目标目录（Markdown 输出目录）</div>
    <div class="dir-row">
      <input type="text" id="targetDir" class="dir-input" placeholder="请选择 Markdown 输出目录..." readonly>
      <button class="btn btn-select" onclick="selectTargetDir()">选择目录</button>
    </div>
  </div>

  <hr class="divider">

  <div class="stats-panel">
    <div class="stat-card">
      <div class="stat-value" id="statDirs">0</div>
      <div class="stat-label">📂 目录数</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-label">📄 总文件数</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statDone">0</div>
      <div class="stat-label">✅ 已转换</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statPending">0</div>
      <div class="stat-label">⏳ 待转换</div>
    </div>
  </div>

  <div class="progress-section">
    <div class="progress-header">
      <div class="progress-title">
        <span class="badge badge-ocr">DeepSeek-OCR 已内置</span>
        <span>图片 OCR 已启用</span>
      </div>
      <div class="progress-status" id="progressStatus">就绪</div>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="log-area" id="logArea">
    <div class="log-info">欢迎使用 MarkItDown 文档转换工具，请选择源目录和目标目录后开始转换。</div>
  </div>

  <div class="failures-section" id="failuresSection">
    <div class="failures-header">❌ 转换失败列表</div>
    <div id="failuresList"></div>
  </div>

  <button class="btn btn-convert" id="convertBtn" onclick="startConvert()">🚀 开始转换</button>

  <div class="footer">MD转换神器 · 图片自动提取 + DeepSeek-OCR 文字识别</div>
  
  <div class="bottom-right">
    <a href="https://github.com/cattei/ConvertoMD" target="_blank" class="github-link">代码开源</a>
    <div style="position: relative;">
      <button class="donate-btn" id="donateBtn">
        💰 打赏
      </button>
      <div class="donate-tooltip" id="donateTooltip">
        <div class="donate-tooltip-title">大爷，有钱的捧个钱场，没钱的捧个Star</div>
        <div class="donate-qrcodes">
          <div class="donate-qrcode">
            <img src="img/wechat.jpg" alt="微信收款码">
            <div class="donate-qrcode-label">微信支付</div>
          </div>
          <div class="donate-qrcode">
            <img src="img/alipay.jpg" alt="支付宝收款码">
            <div class="donate-qrcode-label">支付宝</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const donateBtn = document.getElementById('donateBtn');
  const donateTooltip = document.getElementById('donateTooltip');
  
  donateBtn.addEventListener('mouseenter', () => {
    donateTooltip.classList.add('show');
  });
  
  donateBtn.addEventListener('mouseleave', () => {
    donateTooltip.classList.remove('show');
  });
  
  donateTooltip.addEventListener('mouseenter', () => {
    donateTooltip.classList.add('show');
  });
  
  donateTooltip.addEventListener('mouseleave', () => {
    donateTooltip.classList.remove('show');
  });
</script>

<script>
  const { SelectDirectory, StartConvert } = window.go.main.App;
  
  let failures = [];
  let totalFiles = 0;

  async function selectSourceDir() {
    const dir = await SelectDirectory();
    if (dir) {
      document.getElementById('sourceDir').value = dir;
      if (!document.getElementById('targetDir').value) {
        document.getElementById('targetDir').value = dir + '_md';
      }
    }
  }

  async function selectTargetDir() {
    const dir = await SelectDirectory();
    if (dir) {
      document.getElementById('targetDir').value = dir;
    }
  }

  async function startConvert() {
    const sourceDir = document.getElementById('sourceDir').value;
    const targetDir = document.getElementById('targetDir').value;

    if (!sourceDir) { alert('请选择源目录'); return; }
    if (!targetDir) { alert('请选择目标目录'); return; }

    const btn = document.getElementById('convertBtn');
    btn.disabled = true;
    btn.textContent = '⏳ 转换中...';
    document.getElementById('logArea').innerHTML = '';
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('progressStatus').textContent = '准备中...';
    document.getElementById('failuresSection').classList.remove('show');
    document.getElementById('failuresList').innerHTML = '';
    document.getElementById('statDirs').textContent = '0';
    document.getElementById('statTotal').textContent = '0';
    document.getElementById('statDone').textContent = '0';
    document.getElementById('statPending').textContent = '0';
    failures = [];
    totalFiles = 0;

    try {
      await StartConvert(sourceDir, targetDir);
    } catch (e) {
      addLog('启动失败: ' + e, 'fail');
      btn.disabled = false;
      btn.textContent = '🚀 开始转换';
    }
  }

  runtime.EventsOn('log', (line) => {
    if (line.startsWith('SUCCESS:')) {
      addLog('✅ ' + line.replace('SUCCESS:', ''), 'success');
      updateStats('done');
    } else if (line.startsWith('SKIP:')) {
      addLog('⏭️ ' + line.replace('SKIP:', ''), 'skip');
      updateStats('skip');
    } else if (line.startsWith('FAIL:')) {
      const parts = line.replace('FAIL:', '').split('|');
      const path = parts[0];
      const reason = parts[1] || '未知原因';
      failures.push({ path, reason });
      addLog('❌ ' + path + ' - ' + reason, 'fail');
      updateStats('fail');
    } else if (line.startsWith('PROGRESS:')) {
      const parts = line.replace('PROGRESS:', '').split('/');
      const current = parseInt(parts[0]);
      const total = parseInt(parts[1]);
      if (total > 0) {
        totalFiles = total;
        document.getElementById('statTotal').textContent = total;
        document.getElementById('statPending').textContent = total - current;
      }
    } else if (line.startsWith('STATS:')) {
      const stats = JSON.parse(line.replace('STATS:', ''));
      document.getElementById('statDirs').textContent = stats.dirs || 0;
      document.getElementById('statTotal').textContent = stats.files || 0;
      totalFiles = stats.files || 0;
      document.getElementById('statPending').textContent = stats.files || 0;
    } else if (line.startsWith('DONE:')) {
      const parts = line.replace('DONE:', '').split('|');
      const success = parseInt(parts[0]);
      const fail = parseInt(parts[1]) || 0;
      const skip = parseInt(parts[2]) || 0;
      addLog('🏁 转换完成！成功: ' + success + ' | 失败: ' + fail + ' | 跳过: ' + skip, 'done');
      
      document.getElementById('convertBtn').disabled = false;
      document.getElementById('convertBtn').textContent = '🚀 开始转换';
      document.getElementById('progressStatus').textContent = '转换完成';
      
      if (fail > 0 && failures.length > 0) {
        document.getElementById('failuresSection').classList.add('show');
        const list = document.getElementById('failuresList');
        failures.forEach((item, index) => {
          const div = document.createElement('div');
          div.className = 'failure-item';
          div.innerHTML = `<div class="failure-path">${index + 1}. ${item.path}</div><div class="failure-reason">原因: ${item.reason}</div>`;
          list.appendChild(div);
        });
      }
      
      const totalProcessed = success + fail + skip;
      const nonSuccess = fail + skip;
      let msg = `转换完成！\n\n成功转换: ${success} 个文档\n`;
      if (fail > 0) {
        msg += `转换失败: ${fail} 个文档（已复制原文件到目标目录）\n`;
      }
      if (skip > 0) {
        msg += `跳过（已复制）: ${skip} 个文档\n`;
      }
      if (nonSuccess > 0) {
        msg += `\n无法转换的 ${nonSuccess} 个文档已自动复制到目标目录。`;
      }
      alert(msg);
    } else {
      addLog(line, 'info');
    }
  });

  runtime.EventsOn('progress', (data) => {
    if (data.total > 0) {
      const pct = Math.round((data.current / data.total) * 100);
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressStatus').textContent = `转换中 ${data.current}/${data.total} (${pct}%)`;
    }
  });

  runtime.EventsOn('error', (msg) => {
    addLog('❌ ' + msg, 'fail');
    document.getElementById('convertBtn').disabled = false;
    document.getElementById('convertBtn').textContent = '🚀 开始转换';
    document.getElementById('progressStatus').textContent = '转换失败';
  });

  function addLog(text, type) {
    const logArea = document.getElementById('logArea');
    const div = document.createElement('div');
    div.className = 'log-' + (type || 'info');
    div.textContent = text;
    logArea.appendChild(div);
    logArea.scrollTop = logArea.scrollHeight;
  }

  function updateStats(type) {
    const done = parseInt(document.getElementById('statDone').textContent);
    const pending = parseInt(document.getElementById('statPending').textContent);
    
    if (type === 'done') {
      document.getElementById('statDone').textContent = done + 1;
      document.getElementById('statPending').textContent = Math.max(0, pending - 1);
    } else if (type === 'fail') {
      document.getElementById('statPending').textContent = Math.max(0, pending - 1);
    }
  }
</script>
</body>
</html>
